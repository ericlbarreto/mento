<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 390" font-family="Comic Sans MS, Chalkboard, sans-serif">
  <!-- Hand-drawn demo scene: D. Pedro on horseback by the Ipiranga brook, 7 September 1822. Original sketch, no copied artwork. -->
  <rect width="520" height="390" fill="#fffdf7"/>
  <!-- sky -->
  <circle cx="450" cy="66" r="28" fill="#ffd95a" stroke="#f2b632" stroke-width="3"/>
  <path d="M60 66 q14 -16 30 -4 q13 -12 28 2 q13 2 9 13 h-72 q-5 -8 5 -11z" fill="#fff" stroke="#c9d6e8" stroke-width="2"/>
  <path transform="translate(-140 50)" d="M290 46 q11 -12 24 -3 q11 -9 22 2 q11 2 7 10 h-58 q-4 -6 5 -9z" fill="#fff" stroke="#c9d6e8" stroke-width="2"/>
  <!-- hills -->
  <path d="M0 230 Q90 180 190 214 Q280 170 380 206 Q450 186 520 210 V300 H0Z" fill="#cdeac0" stroke="#7fb36a" stroke-width="2.5"/>
  <path d="M0 270 Q130 246 260 262 T520 258 V390 H0Z" fill="#b5dd9f" stroke="#6f9f5c" stroke-width="2.5"/>
  <!-- the brook (riacho do Ipiranga) -->
  <path d="M0 338 Q80 318 170 334 T340 330 T520 340 V362 Q430 354 340 356 T170 360 T0 364Z" fill="#a9d4f0" stroke="#4f8fc0" stroke-width="2.5"/>
  <path d="M60 346 q12 -6 24 0 M250 346 q12 -6 24 0 M420 350 q12 -6 24 0" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- tufts of grass -->
  <path d="M40 300 l4 -10 l4 10 M470 296 l4 -10 l4 10 M250 384 l4 -10 l4 10 M380 382 l4 -10 l4 10" stroke="#5f9a4a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- trees in the background -->
  <g stroke-linecap="round">
    <line x1="72" y1="240" x2="72" y2="214" stroke="#8a5a3b" stroke-width="5"/>
    <circle cx="72" cy="204" r="18" fill="#8cc36f" stroke="#5f9a4a" stroke-width="2.5"/>
    <line x1="430" y1="232" x2="430" y2="208" stroke="#8a5a3b" stroke-width="5"/>
    <circle cx="430" cy="196" r="16" fill="#8cc36f" stroke="#5f9a4a" stroke-width="2.5"/>
    <line x1="462" y1="236" x2="462" y2="218" stroke="#8a5a3b" stroke-width="4"/>
    <circle cx="462" cy="210" r="11" fill="#9fd083" stroke="#5f9a4a" stroke-width="2.5"/>
  </g>
  <!-- horse: body, legs, neck, head, mane, tail -->
  <g stroke="#4a2e1d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M196 238 l-12 40 l-4 22 M216 244 l4 34 l-2 22 M290 244 l10 32 l8 20 M306 236 l18 30 l10 18" fill="none"/>
    <path d="M180 300 h10 M214 300 h10 M302 296 h10 M330 284 h10" stroke-width="6"/>
    <path d="M178 226 Q186 196 236 198 Q290 194 316 210 Q330 222 316 242 Q290 256 236 252 Q192 254 178 226Z" fill="#b07a4f"/>
    <path d="M300 214 Q318 184 330 158 Q338 146 350 150 L372 168 Q378 178 368 182 L352 178 Q340 196 330 222Z" fill="#b07a4f"/>
    <path d="M330 158 q-8 14 -14 24 M338 152 q-10 18 -18 32" fill="none" stroke="#3a2416" stroke-width="5"/>
    <path d="M182 220 Q160 222 152 250 Q160 240 172 238" fill="none" stroke="#3a2416" stroke-width="6"/>
  </g>
  <circle cx="356" cy="162" r="2.5" fill="#1b120c"/>
  <path d="M344 148 l2 -10 l6 8" fill="#b07a4f" stroke="#4a2e1d" stroke-width="3" stroke-linejoin="round"/>
  <!-- saddle cloth -->
  <path d="M226 200 Q248 196 268 200 L266 232 Q246 238 228 232Z" fill="#2e8b57" stroke="#1f5e3a" stroke-width="3"/>
  <path d="M230 226 Q248 230 264 226" stroke="#ffd95a" stroke-width="3" fill="none"/>
  <!-- rider -->
  <g stroke="#1d3f94" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <path d="M240 206 l-4 22 l10 4" fill="none" stroke-width="5"/>
    <path d="M236 150 Q252 144 262 152 L264 204 Q250 210 236 204Z" fill="#3b6fe0"/>
    <path d="M240 164 h20 M240 176 h20" stroke="#ffd95a" stroke-width="2.5"/>
    <path d="M260 158 Q278 140 290 112" fill="none" stroke-width="5"/>
    <path d="M238 162 Q226 178 236 192" fill="none" stroke-width="5"/>
  </g>
  <circle cx="249" cy="134" r="12" fill="#ffd2b0" stroke="#1d3f94" stroke-width="3"/>
  <!-- bicorne hat with a green-and-yellow cockade -->
  <path d="M230 126 Q249 104 268 126 Q249 120 230 126Z" fill="#1f2a44" stroke="#1d3f94" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="249" cy="118" r="3.5" fill="#ffd95a" stroke="#2e8b57" stroke-width="2"/>
  <!-- raised sword with a shine -->
  <line x1="290" y1="112" x2="316" y2="52" stroke="#7d8794" stroke-width="5" stroke-linecap="round"/>
  <path d="M282 112 l16 4" stroke="#b8862f" stroke-width="5" stroke-linecap="round"/>
  <path d="M326 46 l8 -8 M330 56 l10 0 M318 38 l0 -10" stroke="#f2b632" stroke-width="2.5" stroke-linecap="round"/>
  <!-- speech bubble -->
  <path d="M352 82 Q352 60 384 60 H486 Q508 60 508 82 V100 Q508 122 486 122 H396 L372 138 L380 122 Q352 122 352 100Z" fill="#fff" stroke="#1d3f94" stroke-width="2.5"/>
  <text x="430" y="88" font-size="14" fill="#1d3f94" text-anchor="middle">rompimento</text>
  <text x="430" y="108" font-size="14" fill="#1d3f94" text-anchor="middle">com Portugal!</text>
  <!-- labels -->
  <text x="34" y="384" font-size="15" fill="#2c6a99">riacho do Ipiranga</text>
  <rect x="24" y="14" width="250" height="34" rx="10" fill="#fff4c9" stroke="#d1a43a" stroke-width="2.5"/>
  <text x="149" y="37" font-size="18" fill="#7a4b0f" text-anchor="middle" font-weight="bold">7 de setembro de 1822</text>
</svg>
